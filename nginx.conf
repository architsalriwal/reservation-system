upstream backend {
    server web:8000;
}

server {
    listen 80;
    server_name reservly.architsalriwal.dev;

    # Let's Encrypt's renewal probe hits this path over plain HTTP - keep it
    # working even after the redirect below exists, so certbot's renewal
    # (which runs unattended via the systemd timer, no human present to
    # notice a silent break) doesn't quietly start failing.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name reservly.architsalriwal.dev;

    ssl_certificate     /etc/letsencrypt/live/reservly.architsalriwal.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reservly.architsalriwal.dev/privkey.pem;

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://backend;
    }

    # WebSocket connections need the Upgrade/Connection headers forwarded
    # explicitly - without them this would silently fall back to a
    # regular HTTP proxy and the handshake would fail.
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Pre-built by `npm run build` and copied onto the host - served
    # directly by nginx rather than running a Node build/container on the
    # server itself (a t3.micro's 1GB RAM is tight enough already with
    # Postgres+Redis+Django+Celery all running; a Vite build is one more
    # memory spike this box doesn't need to carry).
    root /usr/share/nginx/frontend;
    index index.html;

    location / {
        try_files $uri /index.html;
    }
}

# The personal portfolio site (architsalriwal.dev) - a separate, static-only
# site sharing this same box/nginx/cert-renewal setup rather than standing up
# a second server. It has no backend of its own, so this block never proxies
# anywhere; it's plain file serving.
server {
    listen 80;
    server_name architsalriwal.dev www.architsalriwal.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name architsalriwal.dev www.architsalriwal.dev;

    ssl_certificate     /etc/letsencrypt/live/architsalriwal.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/architsalriwal.dev/privkey.pem;

    root /usr/share/nginx/portfolio;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
