name: Deploy to AWS EC2

# Manual trigger only, deliberately - the production host is a t3.micro that
# has locked up under load more than once (burstable-CPU-credit exhaustion,
# see the README). An unattended `docker compose up -d --build` firing on
# every push, with no one watching, is exactly the kind of surprise that box
# can't currently absorb. Click "Run workflow" when you actually mean to
# deploy, same as every deploy this project has done so far.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            # Matches the actual layout on the server - the app lives in
            # ~/app, not ~/reservation-system (this drifted from reality
            # after the project was deployed by hand; workflow_dispatch-only
            # means it's safe to leave unwired until someone deliberately
            # configures EC2_HOST/EC2_USER/EC2_SSH_KEY and runs it).
            APP_DIR=/home/${{ secrets.EC2_USER }}/app
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"
            if [ -d .git ]; then
              git pull origin main
            else
              git clone ${{ github.server_url }}/${{ github.repository }}.git .
            fi
            docker compose -f docker-compose.prod.yml up -d --build
