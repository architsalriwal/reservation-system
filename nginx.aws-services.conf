# AWS-services variant of nginx.conf - only the reservly `/` route changes,
# from serving ./frontend/dist locally to reverse-proxying the S3 bucket
# (from infra/aws-services-demo.yaml) as its origin. Everything else
# (HTTPS cert, /api, /admin, /ws, the portfolio site block) is identical to
# nginx.conf. See docker-compose.prod.aws-services.yml for how this file
# gets mounted in place of nginx.conf.

upstream backend {
    server web:8000;
}

server {
    listen 80;
    server_name reservly.architsalriwal.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name reservly.architsalriwal.dev;

    ssl_certificate     /etc/letsencrypt/live/reservly.architsalriwal.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reservly.architsalriwal.dev/privkey.pem;

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://backend;
    }

    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Everything else: reverse-proxy to the S3 bucket's website endpoint as
    # the origin, instead of serving local files. The Host header sent
    # upstream MUST be the S3 website endpoint's own hostname, not our
    # domain - S3's website-hosting feature routes by that header, and it
    # doesn't know anything about reservly.architsalriwal.dev. The S3
    # website endpoint is plain HTTP only (S3 doesn't terminate TLS itself
    # for this feature) - that's fine here because this connection is
    # nginx-to-S3 over AWS's own network, not the public internet; the
    # browser's actual connection to us is still HTTPS, terminated right
    # here by this server block.
    location / {
        proxy_pass http://reservly-aws-services-demo-frontendbucket-yntu9xnpuygl.s3-website.ap-south-1.amazonaws.com;
        proxy_set_header Host reservly-aws-services-demo-frontendbucket-yntu9xnpuygl.s3-website.ap-south-1.amazonaws.com;
        proxy_intercept_errors on;
        error_page 404 = /index.html;
    }
}

# The personal portfolio site - unchanged, still served locally, not part
# of this AWS-services demonstration.
server {
    listen 80;
    server_name architsalriwal.dev www.architsalriwal.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name architsalriwal.dev www.architsalriwal.dev;

    ssl_certificate     /etc/letsencrypt/live/architsalriwal.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/architsalriwal.dev/privkey.pem;

    root /usr/share/nginx/portfolio;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
