AWSTemplateFormatVersion: "2010-09-09"
Description: >
  An IAM role + instance profile letting the existing EC2 instance read
  exactly one Secrets Manager secret (the RDS master password) and nothing
  else - least privilege, scoped to a single resource ARN. Attached to the
  instance after creation; this template does not touch the instance
  itself.

Parameters:
  RDSSecretArn:
    Type: String
    Description: ARN of the Secrets Manager secret holding the RDS master password (from the aws-services-demo stack's RDSSecretArn output).

Resources:
  EC2SecretsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadRDSSecretOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref RDSSecretArn

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2SecretsRole

Outputs:
  InstanceProfileName:
    Value: !Ref EC2InstanceProfile
  RoleArn:
    Value: !GetAtt EC2SecretsRole.Arn
