# Production stack. Secrets (POSTGRES_PASSWORD, STRIPE keys, DJANGO_SECRET_KEY,
# etc.) come from ./backend/.env, which must exist on the host and is never
# committed to git. The Firebase service-account JSON must be copied onto the
# firebase_credentials volume out of band (e.g. `docker cp` after first boot,
# or a secrets-manager-backed init container) - it is deliberately not baked
# into any image layer or committed to this repo.

services:
  postgres:
    restart: unless-stopped
    # Same pgvector-enabled image as local dev - the AI product-search
    # feature needs the `vector` extension, which plain postgres:16 doesn't have.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    restart: unless-stopped
    build: ./backend
    env_file: ./backend/.env
    environment:
      # Override the dev-oriented values in backend/.env (which point at
      # localhost for a host-side venv) with the in-network service names.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      FIREBASE_CREDENTIALS_PATH: /secrets/firebase-adminsdk.json
    volumes:
      - static_files:/code/staticfiles
      - firebase_credentials:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"

  celery_worker:
    restart: unless-stopped
    build: ./backend
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      FIREBASE_CREDENTIALS_PATH: /secrets/firebase-adminsdk.json
    volumes:
      - firebase_credentials:/secrets:ro
    # One prefork child instead of the default (one per CPU): on a 1GB box
    # the extra child was the process the OOM killer kept picking off.
    # --max-memory-per-child (KB) is Celery's own leak guard: once the child
    # exceeds this RSS, Celery kills and respawns it *after its current task
    # finishes* - a clean, task-safe recycle - instead of waiting for the
    # kernel's OOM killer to do it mid-task, which is what happened on Sep 17.
    # 200MB gives headroom over the ~150MB the worker normally sits at.
    command: celery -A config worker --loglevel=info --concurrency=1 --max-memory-per-child=200000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    restart: unless-stopped
    build: ./backend
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      FIREBASE_CREDENTIALS_PATH: /secrets/firebase-adminsdk.json
    command: celery -A config beat --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    restart: unless-stopped
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/code/staticfiles:ro
      - ./frontend/dist:/usr/share/nginx/frontend:ro
      # Static personal portfolio site at the apex domain - see nginx.conf's
      # architsalriwal.dev server block. Plain static files, no build step.
      - ./portfolio-site:/usr/share/nginx/portfolio:ro
      # TLS certs come from certbot running on the HOST (not in this
      # compose file) via `certbot renew`, writing to the standard
      # /etc/letsencrypt path - mounted read-only so nginx picks up
      # renewals automatically on its next reload, without rebuilding
      # or recreating this container.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # A bind mount (host directory), not a named volume - the renewal
      # cron job runs certbot directly on the host, so it needs to write
      # ACME challenge files to a real host path that nginx, inside the
      # container, is also looking at. A named volume would put those
      # files somewhere under /var/lib/docker/volumes instead, invisible
      # to a plain host-side certbot process.
      - ./certbot-webroot:/var/www/certbot
    depends_on:
      - web

  # No certbot service here deliberately: it runs on the host via a cron
  # job (see deploy/renew-cert.sh) instead of as a container, because the
  # only thing it needs to do is (a) write to the webroot nginx already
  # serves and (b) reload nginx after renewing - both are simpler as a
  # host-side cron job than coordinating a second container's lifecycle
  # with this one for a task that runs twice a year.

volumes:
  postgres_data:
  static_files:
  firebase_credentials:
