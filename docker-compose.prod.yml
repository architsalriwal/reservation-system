# Production stack. Secrets (POSTGRES_PASSWORD, STRIPE keys, DJANGO_SECRET_KEY,
# etc.) come from ./backend/.env, which must exist on the host and is never
# committed to git. The Firebase service-account JSON must be copied onto the
# firebase_credentials volume out of band (e.g. `docker cp` after first boot,
# or a secrets-manager-backed init container) - it is deliberately not baked
# into any image layer or committed to this repo.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: ./backend
    env_file: ./backend/.env
    environment:
      # Override the dev-oriented values in backend/.env (which point at
      # localhost for a host-side venv) with the in-network service names.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      FIREBASE_CREDENTIALS_PATH: /secrets/firebase-adminsdk.json
    volumes:
      - static_files:/code/staticfiles
      - firebase_credentials:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"

  celery_worker:
    build: ./backend
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      FIREBASE_CREDENTIALS_PATH: /secrets/firebase-adminsdk.json
    volumes:
      - firebase_credentials:/secrets:ro
    command: celery -A config worker --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build: ./backend
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      FIREBASE_CREDENTIALS_PATH: /secrets/firebase-adminsdk.json
    command: celery -A config beat --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/code/staticfiles:ro
    depends_on:
      - web
      - frontend

volumes:
  postgres_data:
  static_files:
  firebase_credentials:
